<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Monarch Wealth Group{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='animations.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>
    {% block content %}{% endblock %}
    <nav class="mobile-bottom-nav" aria-label="Mobile quick navigation">
        <a href="{{ url_for('index') }}" class="mbn-link">Home</a>
        <a href="{{ url_for('login') }}" class="mbn-link mbn-login btn-ghost-nav">Login</a>
        <a href="{{ url_for('register') }}" class="mbn-link mbn-register btn-nav-primary">Register</a>
    </nav>
    {% block scripts %}{% endblock %}
</body>
</html>
